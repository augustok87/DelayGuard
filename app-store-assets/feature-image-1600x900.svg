<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DelayGuard - proactive shipping delay alerts for Shopify">
  <!--
    DelayGuard App Store feature image (1600x900).
    Design language: navy + gold per UI_UX_REDESIGN_ANCHOUR_INSPIRED.md
    (Primary Navy #1e3a5f, Hero Navy #0f172a, Accent Gold #f59e0b,
     Success Teal #059669, Alert Coral #dc2626, Canvas #f8fafc).
    Dashboard composite uses abstract placeholder bars + generic status
    labels only - no fabricated data, statistics, or testimonials
    (Shopify listing reqs 4.3.3 / 4.3.6).
  -->
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <clipPath id="dashClip">
      <rect x="820" y="130" width="680" height="640" rx="18"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#heroBg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1420" cy="80" r="420" fill="url(#goldGlow)"/>
  <circle cx="120" cy="860" r="360" fill="url(#goldGlow)"/>

  <!-- Brand mark: shield + check -->
  <g transform="translate(110, 200)">
    <path d="M52 0 L104 20 L104 62 C104 102 80 128 52 140 C24 128 0 102 0 62 L0 20 Z"
          fill="#f59e0b"/>
    <path d="M52 12 L92 27 L92 62 C92 94 74 115 52 126 C30 115 12 94 12 62 L12 27 Z"
          fill="#0f172a"/>
    <path d="M32 66 L47 82 L76 46" fill="none" stroke="#f59e0b" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- App name -->
  <text x="250" y="298" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="86" font-weight="800" fill="#ffffff" letter-spacing="-2">DelayGuard</text>
  <rect x="254" y="322" width="150" height="7" rx="3.5" fill="#f59e0b"/>

  <!-- Tagline (benefits-focused, no stats) -->
  <text x="110" y="452" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="47" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Tell customers about shipping</text>
  <text x="110" y="514" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="47" font-weight="700" fill="#ffffff" letter-spacing="-0.5">delays <tspan fill="#f59e0b">before they ask</tspan></text>

  <!-- Supporting line -->
  <text x="110" y="586" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="26" font-weight="400" fill="#cbd5e1">Automatic delay detection and branded notifications</text>
  <text x="110" y="624" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="26" font-weight="400" fill="#cbd5e1">for your Shopify store.</text>

  <!-- Dashboard composite -->
  <g filter="url(#cardShadow)">
    <rect x="820" y="130" width="680" height="640" rx="18" fill="#ffffff"/>
  </g>
  <g clip-path="url(#dashClip)">
    <!-- App bar -->
    <rect x="820" y="130" width="680" height="66" fill="#1e3a5f"/>
    <circle cx="858" cy="163" r="6" fill="#f8fafc" fill-opacity="0.55"/>
    <circle cx="880" cy="163" r="6" fill="#f8fafc" fill-opacity="0.35"/>
    <circle cx="902" cy="163" r="6" fill="#f8fafc" fill-opacity="0.2"/>
    <rect x="936" y="154" width="170" height="18" rx="9" fill="#f8fafc" fill-opacity="0.85"/>
    <rect x="1404" y="150" width="66" height="26" rx="13" fill="#f59e0b"/>

    <!-- Canvas -->
    <rect x="820" y="196" width="680" height="574" fill="#f8fafc"/>

    <!-- Section heading placeholder -->
    <rect x="854" y="226" width="220" height="20" rx="10" fill="#1e3a5f"/>
    <rect x="854" y="258" width="330" height="12" rx="6" fill="#cbd5e1"/>

    <!-- Alert card 1: carrier delay (coral) -->
    <g>
      <rect x="854" y="296" width="612" height="140" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="854" y="296" width="6" height="140" rx="3" fill="#dc2626"/>
      <rect x="884" y="322" width="250" height="16" rx="8" fill="#334155"/>
      <rect x="884" y="352" width="330" height="11" rx="5.5" fill="#cbd5e1"/>
      <rect x="884" y="374" width="290" height="11" rx="5.5" fill="#e2e8f0"/>
      <rect x="1298" y="316" width="148" height="32" rx="16" fill="#dc2626"/>
      <text x="1372" y="338" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="17" font-weight="600" fill="#ffffff">Carrier delay</text>
      <rect x="1236" y="384" width="210" height="36" rx="18" fill="#f59e0b"/>
      <text x="1341" y="408" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="17" font-weight="700" fill="#0f172a">Notify customer</text>
    </g>

    <!-- Alert card 2: in transit (amber) -->
    <g>
      <rect x="854" y="456" width="612" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="854" y="456" width="6" height="120" rx="3" fill="#d97706"/>
      <rect x="884" y="482" width="220" height="16" rx="8" fill="#334155"/>
      <rect x="884" y="512" width="300" height="11" rx="5.5" fill="#cbd5e1"/>
      <rect x="884" y="534" width="260" height="11" rx="5.5" fill="#e2e8f0"/>
      <rect x="1318" y="476" width="128" height="32" rx="16" fill="#d97706"/>
      <text x="1382" y="498" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="17" font-weight="600" fill="#ffffff">In transit</text>
    </g>

    <!-- Alert card 3: resolved (teal) -->
    <g>
      <rect x="854" y="596" width="612" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="854" y="596" width="6" height="120" rx="3" fill="#059669"/>
      <rect x="884" y="622" width="240" height="16" rx="8" fill="#334155"/>
      <rect x="884" y="652" width="320" height="11" rx="5.5" fill="#cbd5e1"/>
      <rect x="884" y="674" width="280" height="11" rx="5.5" fill="#e2e8f0"/>
      <rect x="1322" y="616" width="124" height="32" rx="16" fill="#059669"/>
      <text x="1384" y="638" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif"
            font-size="17" font-weight="600" fill="#ffffff">Resolved</text>
    </g>
  </g>

  <!-- Gold accent baseline -->
  <rect x="0" y="892" width="1600" height="8" fill="#f59e0b"/>
</svg>
